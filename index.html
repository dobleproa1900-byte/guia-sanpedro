<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guía Céntrica San Pedro | PWA</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 240px; width: 100%; border-radius: 0.75rem; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

  <!-- ENCABEZADO Y UBICACIÓN -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-white flex items-center gap-2">
          📍 Guía San Pedro
        </h1>
        <p class="text-xs text-slate-400" id="status-ubicacion">Ubicación: Centro</p>
      </div>
      <button onclick="obtenerUbicacion()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition-all flex items-center gap-1 shadow">
        🎯 Cerca de mí
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-3">

    <!-- CONTENEDOR DEL MAPA -->
    <div class="bg-slate-800 p-2 rounded-xl border border-slate-700 shadow-md">
      <div id="map"></div>
    </div>

    <!-- BUSCADOR POR TEXTO EN TIEMPO REAL -->
    <div class="relative">
      <input 
        type="text" 
        id="input-busqueda" 
        oninput="filtrarLugares()" 
        placeholder="🔍 Buscar hospital, taller, radio, comisaría, súper..." 
        class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-400 text-xs rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 shadow-sm"
      />
    </div>

    <!-- FILTROS POR CATEGORÍAS -->
    <div class="flex gap-2 overflow-x-auto pb-2 text-xs font-medium">
      <button onclick="seleccionarCategoria('todas')" class="btn-cat bg-blue-600 text-white px-3 py-2 rounded-lg whitespace-nowrap" data-cat="todas">Todas</button>
      <button onclick="seleccionarCategoria('salud')" class="btn-cat bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg whitespace-nowrap" data-cat="salud">🏥 Hospital / Salud</button>
      <button onclick="seleccionarCategoria('seguridad')" class="btn-cat bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg whitespace-nowrap" data-cat="seguridad">🚔 Comisaría</button>
      <button onclick="seleccionarCategoria('estacion')" class="btn-cat bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg whitespace-nowrap" data-cat="estacion">⛽ Estaciones</button>
      <button onclick="seleccionarCategoria('supermercado')" class="btn-cat bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg whitespace-nowrap" data-cat="supermercado">🛒 Supermercados</button>
      <button onclick="seleccionarCategoria('taller')" class="btn-cat bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg whitespace-nowrap" data-cat="taller">🛠️ Talleres</button>
      <button onclick="seleccionarCategoria('carniceria')" class="btn-cat bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg whitespace-nowrap" data-cat="carniceria">🥩 Carnicerías</button>
      <button onclick="seleccionarCategoria('radio')" class="btn-cat bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg whitespace-nowrap" data-cat="radio">📻 Radios</button>
      <button onclick="seleccionarCategoria('farmacia')" class="btn-cat bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg whitespace-nowrap" data-cat="farmacia">💊 Farmacias</button>
      <button onclick="seleccionarCategoria('gastronomia')" class="btn-cat bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg whitespace-nowrap" data-cat="gastronomia">🍽️ Bares & Restó</button>
    </div>

    <!-- LISTA DE COMERCIOS Y SERVICIOS -->
    <div id="lista-lugares" class="space-y-3">
      <!-- Carga dinámica -->
    </div>

  </main>

  <script>
    // BASE DE DATOS AMPLIADA - SAN PEDRO
    const lugares = [
      // HOSPITAL Y SALUD
      {
        nombre: "Hospital Subzonal Dr. Lino Piñeiro",
        cat: "salud",
        direccion: "25 de Mayo 1250",
        lat: -33.6815, lng: -59.6608,
        desc: "Hospital público, guardia 24hs y emergencias médicas.",
        tel: "5493329420000"
      },

      // SEGURIDAD / COMISARÍA
      {
        nombre: "Comisaría San Pedro - Policía",
        cat: "seguridad",
        direccion: "Mitre y Mitre 400 (Mitre y Las Heras)",
        lat: -33.6758, lng: -59.6625,
        desc: "Comisaría principal, denuncias y emergencias policiales.",
        tel: "5493329425222"
      },

      // ESTACIONES DE SERVICIO
      {
        nombre: "Estación YPF Centro",
        cat: "estacion",
        direccion: "Pellegrini y Olivieri",
        lat: -33.6802, lng: -59.6635,
        desc: "Combustibles, nafta, gasoil, Full shop y lubricantes.",
        tel: "5493329000000"
      },
      {
        nombre: "Estación Shell San Pedro",
        cat: "estacion",
        direccion: "Mitre y 3 de Febrero",
        lat: -33.6768, lng: -59.6705,
        desc: "Combustibles V-Power, tienda de compras y servicios.",
        tel: "5493329000000"
      },
      {
        nombre: "Estación Axion Energy",
        cat: "estacion",
        direccion: "Av. Sarmiento y 11 de Septiembre",
        lat: -33.6732, lng: -59.6588,
        desc: "Carga de combustible, nafta, diésel y tienda Spot.",
        tel: "5493329000000"
      },

      // SUPERMERCADOS
      {
        nombre: "Supermercado Vea",
        cat: "supermercado",
        direccion: "Pellegrini y B. Mitre",
        lat: -33.6770, lng: -59.6650,
        desc: "Almacén, comestibles, rotisería y ofertas diarias.",
        tel: "5493329000000"
      },
      {
        nombre: "Supermercado San Pedro",
        cat: "supermercado",
        direccion: "Mitre 1150",
        lat: -33.6789, lng: -59.6710,
        desc: "Supermercado autoservicio, bebidas y bazar.",
        tel: "5493329000000"
      },

      // TALLERES MECÁNICOS
      {
        nombre: "Taller Mecánico Multimarca",
        cat: "taller",
        direccion: "3 de Febrero 850",
        lat: -33.6785, lng: -59.6690,
        desc: "Mecánica general, inyección electrónica y frenos.",
        tel: "5493329000000"
      },
      {
        nombre: "Gomería y Mecánica Ligera Centro",
        cat: "taller",
        direccion: "Pellegrini 1020",
        lat: -33.6810, lng: -59.6680,
        desc: "Reparación de neumáticos, alineación y balanceo.",
        tel: "5493329000000"
      },

      // CARNICERÍAS
      {
        nombre: "Carnicería El Buen Corte",
        cat: "carniceria",
        direccion: "Mitre 750",
        lat: -33.6771, lng: -59.6665,
        desc: "Cortes vacunos frescos, cerdo y elaboración de chorizos.",
        tel: "5493329000000"
      },
      {
        nombre: "Carnicería y Granja San Pedro",
        cat: "carniceria",
        direccion: "Pellegrini 620",
        lat: -33.6775, lng: -59.6655,
        desc: "Pollo, carne vacuna, milanesas preparadas y achuras.",
        tel: "5493329000000"
      },

      // RADIOS LOCALES
      {
        nombre: "Radio APA / La Radio 92.3",
        cat: "radio",
        direccion: "Ayacucho 380",
        lat: -33.6745, lng: -59.6620,
        desc: "Radio local FM 92.3 Mhz, noticias e información al instante.",
        tel: "5493329420100"
      },
      {
        nombre: "Radio Cuarentena FM 88.7",
        cat: "radio",
        direccion: "San Martin 220",
        lat: -33.6755, lng: -59.6610,
        desc: "Emisora local FM, música y cobertura periodística.",
        tel: "5493329000000"
      },

      // FARMACIAS
      {
        nombre: "Farmacia Botta",
        cat: "farmacia",
        direccion: "Pellegrini 485",
        lat: -33.6765, lng: -59.6642,
        desc: "Atención farmacéutica, perfumería y medicamentos.",
        tel: "5493329000000"
      },
      {
        nombre: "Farmacia Gomendio",
        cat: "farmacia",
        direccion: "Mitre 902",
        lat: -33.6778, lng: -59.6682,
        desc: "Farmacia céntrica, recetas y atención integral.",
        tel: "5493329000000"
      },

      // GASTRONOMÍA
      {
        nombre: "Favela Grill",
        cat: "gastronomia",
        direccion: "Pellegrini 755",
        lat: -33.6781, lng: -59.6672,
        desc: "Parrilla, minutas y platos elaborados.",
        tel: "5493329000000"
      },
      {
        nombre: "Bar Butti",
        cat: "gastronomia",
        direccion: "Mitre 898",
        lat: -33.6775, lng: -59.6680,
        desc: "Bar histórico, café y minuta tradicional.",
        tel: "5493329000000"
      }
    ];

    let userLat = -33.6760;
    let userLng = -59.6660;
    let categoriaActual = 'todas';

    let map = L.map('map').setView([userLat, userLng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let markersGroup = L.layerGroup().addTo(map);
    let userMarker = null;

    function normalizar(texto) {
      return (texto || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return (R * c).toFixed(2);
    }

    function filtrarLugares() {
      markersGroup.clearLayers();
      const contenedor = document.getElementById('lista-lugares');
      contenedor.innerHTML = '';

      const textoBusqueda = normalizar(document.getElementById('input-busqueda').value);

      lugares.forEach(l => {
        l.distancia = calcularDistancia(userLat, userLng, l.lat, l.lng);
      });

      const filtrados = lugares.filter(l => {
        const coincideCat = (categoriaActual === 'todas' || l.cat === categoriaActual);
        
        const enNombre = normalizar(l.nombre).includes(textoBusqueda);
        const enCategoria = normalizar(l.cat).includes(textoBusqueda);
        const enDesc = normalizar(l.desc).includes(textoBusqueda);
        const enDireccion = normalizar(l.direccion).includes(textoBusqueda);

        // Mapeo inteligente de sinónimos
        let coincideSinonimo = false;
        if (textoBusqueda.includes("hospital") || textoBusqueda.includes("guardia") || textoBusqueda.includes("medico") || textoBusqueda.includes("salud")) {
          coincideSinonimo = (l.cat === "salud");
        } else if (textoBusqueda.includes("comisaria") || textoBusqueda.includes("policia") || textoBusqueda.includes("patrulla")) {
          coincideSinonimo = (l.cat === "seguridad");
        } else if (textoBusqueda.includes("mecanico") || textoBusqueda.includes("gomeria") || textoBusqueda.includes("auto") || textoBusqueda.includes("taller")) {
          coincideSinonimo = (l.cat === "taller");
        } else if (textoBusqueda.includes("carne") || textoBusqueda.includes("asado") || textoBusqueda.includes("carniceria")) {
          coincideSinonimo = (l.cat === "carniceria");
        } else if (textoBusqueda.includes("super") || textoBusqueda.includes("mercado") || textoBusqueda.includes("almacen")) {
          coincideSinonimo = (l.cat === "supermercado");
        } else if (textoBusqueda.includes("radio") || textoBusqueda.includes("fm") || textoBusqueda.includes("noticias")) {
          coincideSinonimo = (l.cat === "radio");
        }

        const coincideTexto = textoBusqueda === "" || enNombre || enCategoria || enDesc || enDireccion || coincideSinonimo;
        
        return coincideCat && coincideTexto;
      }).sort((a, b) => parseFloat(a.distancia) - parseFloat(b.distancia));

      if (filtrados.length === 0) {
        contenedor.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-xs">
            ⚠️ No se encontraron resultados para la búsqueda.
          </div>`;
        return;
      }

      filtrados.forEach(l => {
        L.marker([l.lat, l.lng])
          .addTo(markersGroup)
          .bindPopup(`<b>${l.nombre}</b><br>${l.direccion}`);

        const card = document.createElement('div');
        card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 shadow flex justify-between items-start";
        card.innerHTML = `
          <div class="space-y-1 pr-2">
            <div class="flex items-center gap-2">
              <h3 class="font-bold text-white text-base">${l.nombre}</h3>
              <span class="text-[10px] bg-slate-700 text-blue-300 px-2 py-0.5 rounded-full font-semibold">${l.distancia} km</span>
            </div>
            <p class="text-xs text-slate-400">📍 ${l.direccion}</p>
            <p class="text-xs text-slate-300 pt-1">${l.desc}</p>
          </div>
          <a href="https://wa.me/${l.tel}?text=Hola!%20Los%20vi%20en%20la%20Guia%20San%20Pedro" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center justify-center shrink-0">
            💬 Contactar
          </a>
        `;
        contenedor.appendChild(card);
      });
    }

    function seleccionarCategoria(cat) {
      categoriaActual = cat;
      document.querySelectorAll('.btn-cat').forEach(b => {
        if (b.getAttribute('data-cat') === cat) {
          b.className = "btn-cat bg-blue-600 text-white px-3 py-2 rounded-lg whitespace-nowrap";
        } else {
          b.className = "btn-cat bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg whitespace-nowrap";
        }
      });
      filtrarLugares();
    }

    function obtenerUbicacion() {
      const status = document.getElementById('status-ubicacion');
      if ("geolocation" in navigator) {
        status.innerText = "Obteniendo GPS...";
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
            status.innerText = "📍 Ubicación detectada";

            map.setView([userLat, userLng], 16);

            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.circleMarker([userLat, userLng], {
              radius: 8, fillColor: "#2563eb", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9
            }).addTo(map).bindPopup("¡Estás acá!").openPopup();

            filtrarLugares();
          },
          () => { status.innerText = "⚠️ Error de GPS"; }
        );
      }
    }

    filtrarLugares();
  </script>
</body>
</html>
